# ring：manifest 的 "Apache-2.0 AND ISC" 正確，但沒 clarify 時掃描器把十幾個原始碼檔頭的 ISC 註解各當成一份授權，
# 摘要裡 ring 重複十幾次，又只撈到其中一部分（各檔頭的版權人不只這些）。改依 ring 自己 LICENSE 的說明：
# LICENSE（總說明：新程式碼用 ISC、取自 BoringSSL 的用 Apache-2.0、各檔授權寫在檔頭）與 LICENSE-other-bits
# （ISC，Brian Smith 版權）歸 ISC，LICENSE-BoringSSL 歸 Apache-2.0。
[ring.clarify]
license = "Apache-2.0 AND ISC"

