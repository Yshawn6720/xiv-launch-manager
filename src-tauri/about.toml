# cargo-about 設定：產生 THIRD-PARTY-NOTICES.txt 的 Rust 部分（由 scripts/notices.mjs 呼叫，流程見 docs/release.md
# 「授權與第三方聲明」）。只列發佈的 exe 實際連結的 crate。

# 只發 Windows x64 的 NSIS 安裝檔；其他平台才有的依賴（cfg 篩掉）不列。
targets = ["x86_64-pc-windows-msvc"]
# 不列 build-dependencies：tauri-build 等只在編譯時執行，程式碼不進 exe（build.rs 嵌進 exe 的圖示與 manifest 是本專案自己的檔案）。
# 不列 dev-dependencies：只給測試用（例如 tempfile），不隨安裝檔發佈。
ignore-build-dependencies = true
ignore-dev-dependencies = true
# 本專案自己（publish = false）不是第三方元件。
private = { ignore = true }

# 允許的授權，依優先序：crate 有多種授權可選（例如 "MIT OR Apache-2.0"）時取最前面的一種，與本專案同為 Apache-2.0。
# 任何 crate 的授權無法只用這些滿足時，cargo-about 直接失敗（fail-closed）；新增前先確認義務，見 docs/release.md。
# MPL-2.0：檔案層級的 copyleft，未修改原始碼時，附上授權全文並告知原始碼取得處即可（聲明檔開頭寫了 crates.io 的位置）。
# MIT-0：ppmd-rust 的 "CC0-1.0 OR MIT-0" 只需其一，取 MIT-0。
accepted = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "bzip2-1.0.6",
    "MIT-0",
]

# ---------------------------------------------------------------------------------------------------------
# clarify：cargo-about 自動掃描抓不到正確授權全文的 crate。不 clarify 時，cargo-about 會改用 SPDX 範本全文，
# 範本裡的版權行是 "<year> <owner>" 佔位字，MIT／BSD／ISC 要求保留的版權聲明就不見了。
# 每一筆以 checksum 鎖住來源檔（或 start／end 擷取的段落）；crate 升版後內容不同，checksum 對不上，
# clarify 不會套用，cargo-about 只印 WARN——scripts/notices.mjs 把任何 WARN 都當失敗，要人重新檢查後更新 checksum。
# 未列入的 rustls-webpki、untrusted、rustls：manifest 的授權式正確、套件內的授權檔掃描得到，不需要 clarify。
# 不開 cargo-about 內建的 workarounds：ring workaround 的 checksum 對應 ring 舊版把四種授權合在一個 LICENSE 的寫法，
# 0.17.14 已拆檔，套用只會因 checksum 不符而失效（ring 改用下方的 clarify）；rustls 0.23 已把授權拆成個別檔案，掃描得到。
# ---------------------------------------------------------------------------------------------------------

# aws-lc-rs：LICENSE 開頭是 SPDX 標頭，後面接 Apache-2.0 與 ISC 兩段全文，合在一個檔案裡掃描器認不出來，
# 原本落到範本全文（ISC 段的 "Copyright Amazon.com, Inc." 會遺失）。依 cargo-about 文件用 start／end 擷取 ISC 段。
# 授權式沿用 manifest；ISC 本來就必選，"(Apache-2.0 OR ISC)" 也由 ISC 滿足，所以只需要 ISC 段。
[aws-lc-rs.clarify]
license = "ISC AND (Apache-2.0 OR ISC)"

[[aws-lc-rs.clarify.files]]
path = "LICENSE"
license = "ISC"
start = "ISC license"
end = "OR IN CONNECTION WITH THE USE OR PERFORMANCE OF THIS SOFTWARE."
checksum = "e8a32ff587b5f483695b06272ad3b1e2274cf020f7fa9c2fe3dbf5aa3be039fd"

# aws-lc-sys：LICENSE 前半是編進 libcrypto 的各元件（AWS-LC、BoringSSL、OpenSSL、mlkem／mldsa-native、fiat、
# s2n-bignum、Jitter Entropy）的版權與 SPDX 標示，後半是各授權全文。掃描器只認出 third_party/fiat/LICENSE，
# 其餘全落到範本全文。授權式沿用 manifest；各段依內容歸到對應的授權：
# - 前半的版權與來源說明歸 ISC（Amazon 與 Google 的 ISC 版權行都在這段）；
# - Jitter Entropy 那段（Stephan Mueller 的版權、Amazon 選 BSD-3-Clause 而非 GPL-2.0 的聲明）歸 BSD-3-Clause；
# - MIT 用 fiat 自己的 LICENSE（含 fiat-crypto authors 的版權行）。
[aws-lc-sys.clarify]
license = "ISC AND (Apache-2.0 OR ISC) AND Apache-2.0 AND MIT AND BSD-3-Clause AND (Apache-2.0 OR ISC OR MIT) AND (Apache-2.0 OR ISC OR MIT-0)"

